<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Attention Visualization</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="App-header">
        <h1>Flash Attention Visualization</h1>
        <div class="controls">
            <button id="reset-btn">Reset</button>
            <span id="step-info">Step: 0 / ?</span>
            <button id="next-step-btn">Next Step</button>
        </div>
    </header>

    <div class="page-container">
        <aside class="sidebar">
            <h3>Global State</h3>
            <div class="sidebar-row">
                <div id="max-logit-matrix" class="matrix-container"><h4>Max Logit (m)</h4></div>
                <div id="row-sum-matrix" class="matrix-container"><h4>Row Sum (l)</h4></div>
            </div>
            <hr>
            <div id="output-matrix" class="matrix-container"><h4>Output (O)</h4></div>
        </aside>

        <main class="main-content">
            <div class="main-container">
                <div class="computation-row">
                    <div id="q-matrix" class="matrix-container"><h4>Query (Q)</h4></div>
                    <div class="symbol">@</div>
                    <div id="k-matrix" class="matrix-container"><h4>Key Transposed (K^T)</h4></div>
                    <div class="symbol">=</div>
                    <div id="logits-matrix" class="matrix-container"><h4>Logits (S)</h4></div>
                </div>
                <hr>
                <h4>Block Calculations &amp; Global Updates</h4>
                <div class="computation-row">
                    <div class="final-op-group">
                        <div id="s-block-for-m-calc" class="matrix-container"></div>
                        <div class="symbol-group"><span class="symbol">&rarr;</span><br>max(axis=1)</div>
                        <div id="m-block-result" class="matrix-container"></div>
                    </div>
                    <div class="symbol" style="font-size: 4rem;">;</div>
                    <div class="final-op-group">
                        <div id="s-block-display" class="matrix-container"></div>
                        <div class="symbol">-</div>
                        <div id="m-block-display" class="matrix-container"></div>
                        <div class="symbol">=</div>
                        <div id="s-minus-m-matrix" class="matrix-container"></div>
                    </div>
                </div>
                <div class="computation-row">
                    <div class="symbol-group">
                        <p>P = exp(S<sub>block</sub> - m<sub>block</sub>)</p>
                    </div>
                    <div class="symbol">&rarr;</div>
                    <div id="p-matrix" class="matrix-container"></div>
                    <div class="arrow-with-text">
                        <span class="arrow-text">sum(axis=1)</span>
                        <span class="arrow-symbol">&rarr;</span>
                    </div>
                    <div id="l-block-result" class="matrix-container"></div>
                </div>
                <div class="computation-row">
                    <div class="final-op-group">
                        <div class="graphical-op" data-op="max">
                            <div id="m-old-matrix" class="matrix-container"></div>
                            <div class="symbol">+</div>
                            <div id="m-block-context" class="matrix-container"></div>
                        </div>
                        <div class="symbol op-arrow">&rarr;</div>
                        <div id="m-new-matrix" class="matrix-container"></div>
                    </div>
                    <div class="symbol" style="font-size: 4rem;">;</div>
                    <div class="final-op-group">
                         <div class="graphical-op" data-op="rescale_sum">
                            <div id="l-old-matrix" class="matrix-container"></div>
                            <div class="symbol">+</div>
                            <div id="l-block-context" class="matrix-container"></div>
                        </div>
                        <div class="symbol op-arrow">&rarr;</div>
                        <div id="l-new-matrix" class="matrix-container"></div>
                    </div>
                </div>
                <hr>
                <div class="computation-row">
                    <div id="p-matrix-for-o-calc" class="matrix-container"></div>
                    <div class="symbol">@</div>
                    <div id="v-matrix" class="matrix-container"></div>
                    <div class="symbol">=</div>
                    <div id="o-block-result" class="matrix-container"></div>
                </div>
                <div class="computation-row final-op">
                    <div class="graphical-op" data-op="update_output">
                        <div id="o-old-matrix" class="matrix-container"></div>
                        <div class="symbol">+</div>
                        <div id="o-block-context" class="matrix-container"></div>
                    </div>
                    <div class="symbol op-arrow">&rarr;</div>
                    <div id="o-new-matrix" class="matrix-container"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
